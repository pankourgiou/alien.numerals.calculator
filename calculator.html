<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alien Numeral System — Field Calculator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --bg: #eee8db;
    --panel: #f5f0e5;
    --ink: #18150f;
    --ink-soft: #6b6558;
    --line: #cdc4ac;
    --accent: #9a3f2e;
    --accent-deep: #7a3123;
    --shadow: rgba(24,21,15,0.18);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0; min-height:100%;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 25% 20%, rgba(24,21,15,0.03), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(24,21,15,0.03), transparent 45%);
    font-family: 'JetBrains Mono', monospace;
    color: var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .app{
    width: 410px;
    max-width: 94vw;
    margin: 24px auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    box-shadow: 0 30px 60px -22px var(--shadow);
    padding: 28px 22px 20px;
    position: relative;
  }

  .crosshair{
    position:absolute;
    width: 12px; height:12px;
    opacity: 0.5;
  }
  .crosshair::before, .crosshair::after{
    content:"";
    position:absolute;
    background: var(--ink-soft);
  }
  .crosshair::before{ width:12px; height:1px; top:5.5px; left:0; }
  .crosshair::after{ width:1px; height:12px; left:5.5px; top:0; }
  .cx-tl{ top:10px; left:10px; }
  .cx-tr{ top:10px; right:10px; }
  .cx-bl{ bottom:10px; left:10px; }
  .cx-br{ bottom:10px; right:10px; }

  header{ text-align:center; margin-bottom: 18px; }

  h1{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 0.08em;
    margin: 0 0 8px;
    text-transform: uppercase;
    color: var(--ink);
  }

  .subtitle{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: 10.5px;
    letter-spacing: 0.18em;
    color: var(--ink-soft);
    text-transform: uppercase;
  }

  .display-panel{
    background: #fbf8f0;
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 14px 14px 10px;
    margin-bottom: 16px;
    min-height: 112px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    gap:8px;
  }

  .history-row{
    min-height: 24px;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:6px;
    opacity: 0.5;
  }
  .history-row img{ height:18px; width:auto; }
  .history-row .op-symbol{ font-size: 14px; color: var(--accent-deep); font-weight: 600; }

  .current-row{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap: 6px;
    flex-wrap: wrap;
    min-height: 44px;
  }
  .current-row img{ height: 38px; width: auto; }
  .current-row .punct{
    font-family: 'Space Grotesk', sans-serif;
    font-size: 30px;
    font-weight: 600;
    color: var(--ink);
    line-height:1;
  }

  .translit{
    text-align:right;
    font-size: 11px;
    letter-spacing: 0.05em;
    color: var(--ink-soft);
  }
  .translit::before{ content: "= "; opacity: 0.6; }

  .keypad{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  button{
    font-family: 'JetBrains Mono', monospace;
    border: none;
    cursor: pointer;
    border-radius: 4px;
    height: 62px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    transition: transform 0.06s ease, box-shadow 0.15s ease, filter 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  button:active{ transform: translateY(2px) scale(0.98); }

  .key-glyph{
    background: #fbf8f0;
    border: 1px solid var(--line);
    box-shadow: 0 1px 3px rgba(24,21,15,0.06);
    flex-direction: column;
    gap: 3px;
    padding-top: 4px;
  }
  .key-glyph:hover{ background: #fff; border-color: var(--ink-soft); }
  .key-glyph img{ height: 22px; width:auto; }
  .key-glyph .num{
    font-family: 'Space Grotesk', sans-serif;
    font-size: 10px;
    font-weight: 500;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
  }

  .key-fn{
    background: #e4dcc9;
    border: 1px solid var(--line);
    color: var(--ink);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 16px;
    font-weight: 600;
  }
  .key-fn:hover{ background: #dcd3bd; }

  .key-op{
    background: var(--accent);
    color: #f5f0e5;
    font-size: 20px;
    font-weight: 600;
    box-shadow: 0 3px 8px rgba(122,49,35,0.3);
  }
  .key-op:hover{ background: var(--accent-deep); }

  .key-eq{
    background: var(--ink);
    color: #f5f0e5;
    font-size: 18px;
  }

  footer{
    text-align:center;
    margin-top: 16px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 9.5px;
    letter-spacing: 0.14em;
    color: var(--ink-soft);
    text-transform: uppercase;
    opacity: 0.7;
  }

  @media (max-width: 380px){
    .app{ padding: 22px 14px 16px; }
    button{ height: 56px; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="crosshair cx-tl"></div>
  <div class="crosshair cx-tr"></div>
  <div class="crosshair cx-bl"></div>
  <div class="crosshair cx-br"></div>

  <header>
    <h1>Alien Numeral System</h1>
    <div class="subtitle">Field Calculator &middot; Series I</div>
  </header>

  <div class="display-panel">
    <div class="history-row" id="historyRow"></div>
    <div class="current-row" id="currentRow"></div>
    <div class="translit" id="translit">0</div>
  </div>

  <div class="keypad" id="keypad"></div>

  <footer>ten specimens, one system</footer>
</div>

const DIGIT_ORDER = ['7','8','9','4','5','6','1','2','3','0'];

let display = '0';
let pending = null;
let justEvaluated = false;

const currentRow = document.getElementById('currentRow');
const historyRow = document.getElementById('historyRow');
const translit = document.getElementById('translit');
const keypad = document.getElementById('keypad');

function opSymbol(op){ return {'+':'+','-':'\u2212','*':'\u00d7','/':'\u00f7'}[op] || ''; }

function renderNumberInto(container, numStr, big){
  container.innerHTML = '';
  for(const ch of numStr){
    if(ch === '.' || ch === '-'){
      const span = document.createElement('span');
      span.className = big ? 'punct' : 'op-symbol';
      span.textContent = ch === '-' ? '\u2212' : '.';
      container.appendChild(span);
    } else if (GLYPHS[ch]) {
      const img = document.createElement('img');
      img.src = GLYPHS[ch];
      img.alt = ch;
      container.appendChild(img);
    }
  }
}

function render(){
  renderNumberInto(currentRow, display, true);
  translit.textContent = display;

  historyRow.innerHTML = '';
  if(pending !== null){
    const numSpan = document.createElement('span');
    numSpan.style.display = 'flex';
    numSpan.style.gap = '4px';
    numSpan.style.alignItems = 'center';
    renderNumberInto(numSpan, String(pending.value), false);
    historyRow.appendChild(numSpan);
    const opSpan = document.createElement('span');
    opSpan.className = 'op-symbol';
    opSpan.textContent = opSymbol(pending.op);
    historyRow.appendChild(opSpan);
  }
}

function inputDigit(d){
  if(justEvaluated){ display = d; justEvaluated = false; }
  else if(display === '0'){ display = d; }
  else {
    if(display.replace('-','').replace('.','').length >= 12) return;
    display += d;
  }
  render();
}

function inputDot(){
  if(justEvaluated){ display = '0.'; justEvaluated = false; render(); return; }
  if(!display.includes('.')) display += '.';
  render();
}

function clearAll(){ display = '0'; pending = null; justEvaluated = false; render(); }

function backspace(){
  if(justEvaluated){ clearAll(); return; }
  if(display.length <= 1 || (display.length === 2 && display.startsWith('-'))) display = '0';
  else display = display.slice(0, -1);
  render();
}

function toggleSign(){
  if(display === '0') return;
  display = display.startsWith('-') ? display.slice(1) : '-' + display;
  render();
}

function percent(){
  const v = parseFloat(display) / 100;
  display = trimNumber(v);
  render();
}

function trimNumber(v){
  if(!isFinite(v)) return 'Error';
  let s = String(Math.round(v * 1e10) / 1e10);
  if(s.length > 14) s = v.toExponential(6);
  return s;
}

function compute(a, b, op){
  switch(op){
    case '+': return a + b;
    case '-': return a - b;
    case '*': return a * b;
    case '/': return b === 0 ? NaN : a / b;
  }
}

function chooseOperator(op){
  const current = parseFloat(display);
  if(pending !== null && !justEvaluated){
    const result = compute(pending.value, current, pending.op);
    display = trimNumber(result);
    pending = { value: parseFloat(display), op };
  } else {
    pending = { value: current, op };
  }
  justEvaluated = false;
  display = '0';
  render();
}

function equals(){
  if(pending === null) return;
  const current = parseFloat(display);
  const result = compute(pending.value, current, pending.op);
  display = trimNumber(result);
  pending = null;
  justEvaluated = true;
  render();
}

function buildKey(kind, opts){
  const btn = document.createElement('button');
  btn.className = kind;
  if(opts.html) btn.innerHTML = opts.html;
  else btn.textContent = opts.text || '';
  btn.addEventListener('click', opts.onClick);
  return btn;
}

function glyphKey(d){
  return buildKey('key-glyph', {
    html: `<img src="${GLYPHS[d]}" alt="${d}"><span class="num">${d}</span>`,
    onClick: () => inputDigit(d)
  });
}

keypad.appendChild(buildKey('key-fn', { text:'C', onClick: clearAll }));
keypad.appendChild(buildKey('key-fn', { text:'\u232b', onClick: backspace }));
keypad.appendChild(buildKey('key-fn', { text:'%', onClick: percent }));
keypad.appendChild(buildKey('key-op', { text:'\u00f7', onClick: () => chooseOperator('/') }));

['7','8','9'].forEach(d => keypad.appendChild(glyphKey(d)));
keypad.appendChild(buildKey('key-op', { text:'\u00d7', onClick: () => chooseOperator('*') }));

['4','5','6'].forEach(d => keypad.appendChild(glyphKey(d)));
keypad.appendChild(buildKey('key-op', { text:'\u2212', onClick: () => chooseOperator('-') }));

['1','2','3'].forEach(d => keypad.appendChild(glyphKey(d)));
keypad.appendChild(buildKey('key-op', { text:'+', onClick: () => chooseOperator('+') }));

keypad.appendChild(buildKey('key-fn', { text:'\u00b1', onClick: toggleSign }));
keypad.appendChild(glyphKey('0'));
keypad.appendChild(buildKey('key-fn', { text:'.', onClick: inputDot }));
keypad.appendChild(buildKey('key-eq', { text:'=', onClick: equals }));

window.addEventListener('keydown', (e) => {
  if(e.key >= '0' && e.key <= '9') inputDigit(e.key);
  else if(e.key === '.') inputDot();
  else if(e.key === '+') chooseOperator('+');
  else if(e.key === '-') chooseOperator('-');
  else if(e.key === '*') chooseOperator('*');
  else if(e.key === '/') { e.preventDefault(); chooseOperator('/'); }
  else if(e.key === 'Enter' || e.key === '=') equals();
  else if(e.key === 'Backspace') backspace();
  else if(e.key === 'Escape') clearAll();
});

render();
</script>
